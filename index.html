<style>
*,
*::after,
*::before {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

:root {
  --dark-color: #06050E;
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 100vh;
  background-color: var(--dark-color);
  overflow: hidden;
  perspective: 1000px;
}
.night {
  position: fixed;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 100%;
  filter: blur(0.1vmin);
  background-image: radial-gradient(
      ellipse at top,
      transparent 0%,
      var(--dark-color)
    ),
    radial-gradient(
      ellipse at bottom,
      var(--dark-color),
      rgba(227, 148, 1, 0.22)
    ),
    repeating-linear-gradient(
      220deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px
    ),
    repeating-linear-gradient(
      189deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px

    repeating-linear-gradient(
      148deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,

}

.flowers {

  transform: scale(0.9);
}

}
.flower--1 {

  animation: moving-flower-1 4s linear infinite;
}

  height: 70vmin;
  -webkit-animation-delay: 0.3s;
  animation-delay: 0.3s;
}
.flower--1 .flower__line__leaf--1 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
  animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
}
.flower--1 .flower__line__leaf--2 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
  animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
}
.flower--1 .flower__line__leaf--3 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
}
.flower--1 .flower__line__leaf--4 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1s backwards;
}
.flower--1 .flower__line__leaf--5 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
  animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
}
.flower--1 .flower__line__leaf--6 {

  animation: blooming-leaf-left var(--fl-speed) 2s backwards;
}
.flower--2 {
  left: 50%;
  transform: rotate(20deg);
  -webkit-animation: moving-flower-2 4s linear infinite;
  animation: moving-flower-2 4s linear infinite;
}
.flower--2 .flower__line {
  height: 60vmin;
  -webkit-animation-delay: 0.6s;
  animation-delay: 0.6s;
}

  animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
}
.flower--2 .flower__line__leaf--2 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
  animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
}
.flower--2 .flower__line__leaf--3 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
}
.flower--2 .flower__line__leaf--4 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
}
.flower--3 {
  left: 50%;
  transform: rotate(-15deg);
  -webkit-animation: moving-flower-3 4s linear infinite;
  animation: moving-flower-3 4s linear infinite;
}
.flower--3 .flower__line {
  -webkit-animation-delay: 0.9s;
  animation-delay: 0.9s;
}
.flower--3 .flower__line__leaf--1 {

  animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
}

  -webkit-animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
  animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
}

  -webkit-animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
  animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
}
.flower--3 .flower__line__leaf--4 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
}
.flower__leafs {
  position: relative;
  -webkit-animation: blooming-flower 2s backwards;
  animation: blooming-flower 2s backwards;
}
.flower__leafs--1 {
  -webkit-animation-delay: 1.1s;
  animation-delay: 1.1s;
}
.flower__leafs--2 {
  -webkit-animation-delay: 1.4s;
  animation-delay: 1.4s;
}
.flower__leafs--3 {
  -webkit-animation-delay: 1.7s;
  animation-delay: 1.7s;
}
.flower__leafs::after {
  content: "";

  left: 0;
  top: 0;
  transform: translate(-50%, -100%);
  width: 8vmin;
  height: 8vmin;
  background-color: #E7A21B;

}
.flower__leaf {

.flower__leaf--4 {

}

  height: 4vmin;

}

.flower__line {
  height: 55vmin;
  width: 1.5vmin;
  background-image: linear-gradient(
      to left,
      rgba(0, 0, 0, 0.2),
      transparent,
      rgba(255, 255, 255, 0.2)

    linear-gradient(to top, transparent 10%, #056d24, #028137);

  -webkit-animation: grow-flower-tree 4s backwards;
  animation: grow-flower-tree 4s backwards;
}
.flower__line__leaf {
  --w: 7vmin;
  --h: calc(var(--w) + 2vmin);
  position: absolute;
  top: 20%;
  left: 90%;
  width: var(--w);
  height: var(--h);
  border-top-right-radius: var(--h);
  border-bottom-left-radius: var(--h);
  background-image: linear-gradient(to top, rgba(12, 94, 32, 0.4), #028137);
}
.flower__line__leaf--1 {
  transform: rotate(70deg) rotateY(30deg);
}
.flower__line__leaf--2 {
  top: 45%;
  transform: rotate(70deg) rotateY(30deg);
}
.flower__line__leaf--3,
.flower__line__leaf--4,
.flower__line__leaf--6 {
  border-top-right-radius: 0;
  border-bottom-left-radius: 0;
  border-top-left-radius: var(--h);
  border-bottom-right-radius: var(--h);
  left: -460%;
  top: 12%;
  transform: rotate(-70deg) rotateY(30deg);
}
.flower__line__leaf--4 {

.flower__line__leaf--5 {
  top: 0;
  transform-origin: left;

}

  top: -2%;

  transform: rotate(-70deg) rotateY(30deg) scale(0.6);
}
.flower__light {

}

  left: -2vmin;

}
.flower__light--2 {

}

  width: 7vmin;

  transform: rotate(-2deg);
}

/* ---------------------------------------------------------------
   Personalización: Día del amor y la amistad
   Escena nocturna en un solo tema — la noche es el diseño.
   --------------------------------------------------------------- */

:root {
  --noche:       #06050E;
  --amarillo:    #FFE168;
  --oro:         #E7A21B;
  --brasa:       #E0334E;
  --crema:       #FFF3D6;
  --crema-suave: rgba(255, 243, 214, 0.60);
}

body {
  background: var(--noche);
  color: var(--crema);
  font-family: "Jost", "Segoe UI", system-ui, sans-serif;
}

/* Pétalos: de oro en la base a amarillo encendido en la punta */
.flower__leaf,
.flower__leaf--4 {
  background-image: linear-gradient(to top, var(--oro) 0%, var(--amarillo) 72%);
}

/* --- El mensaje ------------------------------------------------ */

.mensaje {
  position: fixed;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 1.15rem;
  padding: 2.6rem 1.9rem;
  pointer-events: none;
  text-wrap: pretty;
  animation: llegar 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) 0.35s backwards;
}

/* Velo suave tras el texto: se apaga del todo antes del borde, sin costura */
.mensaje::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -45% -32%;
  background: radial-gradient(
    closest-side,
    rgba(6, 5, 14, 0.94) 0%,
    rgba(6, 5, 14, 0.74) 40%,
    rgba(6, 5, 14, 0) 100%
  );
}

@keyframes llegar {
  from { opacity: 0; transform: translateY(1.1rem); }
  to   { opacity: 1; transform: none; }
}

@keyframes aparecer {
  from { opacity: 0; }
}

.mensaje__fecha {
  font-size: 0.72rem;
  font-weight: 400;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--amarillo);
}

.mensaje__titulo {
  font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(2.7rem, 8.4vw, 4.8rem);
  line-height: 0.98;
  letter-spacing: -0.005em;
  text-wrap: balance;
  text-shadow: 0 0.12em 0.9em rgba(6, 5, 14, 0.95);
}

.mensaje__titulo em {
  font-style: normal;
  font-weight: 500;
  color: var(--amarillo);
}

.mensaje__linea {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-weight: 500;
  font-size: clamp(1.28rem, 3.5vw, 1.72rem);
  line-height: 1.35;
  text-shadow: 0 0.12em 0.8em rgba(6, 5, 14, 0.95);
}

.mensaje__nota {
  max-width: 30ch;
  font-size: 0.92rem;
  font-weight: 300;
  line-height: 1.65;
  color: var(--crema-suave);
}

/* El remate: la frase que carga el peso de toda la página */
.mensaje__remate {
  margin-top: 0.35rem;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(1.95rem, 5.4vw, 2.6rem);
  line-height: 1;
  color: var(--amarillo);
  text-shadow: 0 0.12em 0.85em rgba(6, 5, 14, 0.95);
}

.mensaje__firma {
  margin-top: -0.35rem;
  font-size: 0.7rem;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--crema-suave);
}

/* Vertical / móvil: el texto arriba, las flores crecen hacia él */
@media (max-aspect-ratio: 1/1) {
  .mensaje {
    top: 0;
    left: 0;
    right: 0;
    align-items: center;
    text-align: center;
    padding-top: max(3.2rem, 7vh);
  }
  .mensaje__nota { max-width: 26ch; }
}

/* Apaisado / escritorio: el texto a la izquierda, el ramo al centro */
@media (min-aspect-ratio: 1/1) {
  .mensaje {
    top: 50%;
    left: max(2vw, 1rem);
    transform: translateY(-50%);
    align-items: flex-start;
    max-width: 36ch;
    text-align: left;
    padding: 3rem 2.4rem;
    animation-name: llegar-lado;
  }
  @keyframes llegar-lado {
    from { opacity: 0; transform: translateY(calc(-50% + 1.1rem)); }
    to   { opacity: 1; transform: translateY(-50%); }
  }
}

/* --- Marca de agua --------------------------------------------- */

.marca {
  position: fixed;
  right: clamp(1rem, 3vw, 2.2rem);
  bottom: clamp(1rem, 3vh, 2.2rem);
  z-index: 300;
  width: clamp(52px, 7vmin, 82px);
  color: var(--crema);
  opacity: 0.4;
  pointer-events: none;
  animation: aparecer 1.6s ease-out 1.1s backwards;
}

.marca svg { display: block; width: 100%; height: auto; }
.marca path { fill: currentColor; }

/* --- Corazones al tocar ---------------------------------------- */

.toque {
  position: fixed;
  z-index: 290;
  width: 3.4vmin;
  height: 3.4vmin;
  margin: -1.7vmin 0 0 -1.7vmin;
  fill: var(--brasa);
  pointer-events: none;
  animation: subir 2.1s cubic-bezier(0.25, 0.7, 0.4, 1) forwards;
}

@keyframes subir {
  0%   { opacity: 0; transform: scale(0.3) rotate(-8deg); }
  18%  { opacity: 1; transform: scale(1.15) rotate(4deg); }
  100% { opacity: 0; transform: translateY(-22vmin) scale(0.75) rotate(10deg); }
}

/* --- La canción ------------------------------------------------
   El reproductor de YouTube queda a la vista pero apagado en la
   esquina; el botón es el control real. */

.reproductor {
  position: fixed;
  left: clamp(1rem, 3vw, 2.2rem);
  bottom: calc(clamp(1.1rem, 3vh, 2.4rem) + 3.1rem);
  z-index: 300;
  width: clamp(124px, 16vmin, 168px);
  aspect-ratio: 16 / 9;
  border-radius: 0.45rem;
  overflow: hidden;
  opacity: 0.26;
  transition: opacity 0.45s ease;
}

.reproductor:hover,
.reproductor:focus-within { opacity: 0.8; }

.reproductor iframe { display: block; width: 100%; height: 100%; border: 0; }

.cancion {
  position: fixed;
  left: clamp(1rem, 3vw, 2.2rem);
  bottom: clamp(1.1rem, 3vh, 2.4rem);
  z-index: 300;
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.5rem 1rem 0.5rem 0.8rem;
  border: 1px solid rgba(255, 243, 214, 0.2);
  border-radius: 999px;
  background: rgba(6, 5, 14, 0.62);
  color: var(--crema-suave);
  font-family: inherit;
  font-size: 0.66rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  transition: color 0.3s ease, border-color 0.3s ease;
  animation: aparecer 1.6s ease-out 1.4s backwards;
}

.cancion:hover { color: var(--crema); border-color: rgba(255, 225, 104, 0.5); }
.cancion:focus-visible { outline: 2px solid var(--amarillo); outline-offset: 3px; }

.cancion__nota { font-size: 1rem; line-height: 1; color: var(--amarillo); }

.cancion[aria-pressed="true"] .cancion__nota {
  animation: latir 1.9s ease-in-out infinite;
}

/* En apaisado el mensaje ocupa la columna izquierda: el reproductor se va
   al extremo opuesto, junto a la marca de agua. Esta regla tiene que ir
   después de la base o la sobrescribe el orden de cascada. */
@media (min-aspect-ratio: 1/1) {
  .reproductor {
    left: auto;
    right: calc(clamp(1rem, 3vw, 2.2rem) + clamp(52px, 7vmin, 82px) + 1.3rem);
    bottom: clamp(1rem, 3vh, 2.2rem);
  }
}

@keyframes latir {
  0%, 100% { opacity: 0.4; }

<script>
  (function () {
    var CORAZON = "M23.6 2c-3.363 0-6.258 2.736-7.599 5.594-1.342-2.858-4.237-5.594-7.601-5.594-4.637 0-8.4 3.764-8.4 8.401 0 9.433 9.516 11.906 16.001 21.232 6.13-9.268 15.999-12.1 15.999-21.232 0-4.637-3.763-8.401-8.4-8.401z";
    var NS = "http://www.w3.org/2000/svg";
    var params = new URLSearchParams(location.search);

    function limpio(valor) {
      return valor ? valor.trim().replace(/\s+/g, " ").slice(0, 40) : "";
    }

    var para = limpio(params.get("para"));
    if (para) {
      document.querySelector(".mensaje__fecha").textContent = "Para " + para;
    }

    var de = limpio(params.get("de"));
    if (de) {
      document.querySelector(".mensaje__firma").textContent = de;
    }

    /* --- La canción -------------------------------------------------
       El navegador bloquea el sonido hasta que alguien toca la página,
       así que se intenta arrancar sola y, si no la dejan, el primer
       toque en cualquier parte la pone. El botón siempre manda. */

    var VIDEO = "S7gMzYqXIZc";
    var DESDE = 30;
    var VOLUMEN = 35;

    var boton = document.getElementById("cancion");
    var texto = boton.querySelector(".cancion__texto");
    var player = null;
    var tocada = false;

    function sonando() {
      return player && typeof player.getPlayerState === "function" &&
             player.getPlayerState() === YT.PlayerState.PLAYING;
    }

    function pintar(activa) {
      boton.setAttribute("aria-pressed", activa ? "true" : "false");
      texto.textContent = activa ? "Pausar la canción" : "Poner la canción";
    }

    function arrancar() {
      if (!player || sonando()) return;
      player.setVolume(VOLUMEN);
      if (!tocada) { player.seekTo(DESDE); tocada = true; }
      player.playVideo();
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("yt", {
        videoId: VIDEO,
        playerVars: {
          autoplay: 1,
          start: DESDE,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          origin: location.origin
        },
        events: {
          onReady: function (e) {
            e.target.setVolume(VOLUMEN);
            e.target.playVideo();
            tocada = true;
          },
          onStateChange: function (e) {
            pintar(e.data === YT.PlayerState.PLAYING);
          }
        }
      });
    };

    boton.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    boton.addEventListener("click", function () {
      if (sonando()) player.pauseVideo();
      else arrancar();
    });

    /* --- Corazones al tocar, y la canción con el primer toque ------- */

    var suave = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    document.addEventListener("pointerdown", function (e) {
      arrancar();
      if (suave) return;

      var svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", "0 0 32 32");
      svg.setAttribute("class", "toque");
      svg.setAttribute("aria-hidden", "true");
      svg.style.left = e.clientX + "px";
      svg.style.top = e.clientY + "px";
      var path = document.createElementNS(NS, "path");
      path.setAttribute("d", CORAZON);
      svg.appendChild(path);
      document.body.appendChild(svg);
      svg.addEventListener("animationend", function () { svg.remove(); });
    });
  })();
</script>
